# 最小曲率 QP 优化参数
# 赛道闭合后后台线程执行一次。
# 流程：原始路径 → 降采样 → QP优化 → B样条回插 → 全分辨率路径
#
# QP 问题：
#   min  Σ κ_i²(l) + λ·Σ l_i²      (曲率最小化 + 偏离惩罚)
#   s.t. |l_i| ≤ d_max              (位置硬约束)
#        |κ_i(l)| ≤ kappa_max       (曲率硬约束)
#
# 曲率线性化：κ_i(l) ≈ κ_i(0) + J_i·l
# 求解器：自包含 ADMM（交替方向乘子法），无外部依赖
qp_optimization:
  enable: true                 # 总开关，true 

  # ---- 硬约束 ----
  d_max: 0.20                     # 位置硬约束：|l_i| ≤ d_max,每个路径点最多偏离原始路径多少米

  kappa_max: 0.25                 # 曲率硬约束：|κ_i| ≤ kappa_max


  # ---- 优化程度：平滑 vs 保真权衡 ----
  smoothness_weight: 0.0          # 保真度权重 λ
                                  # 目标函数 = Σκ² + λ·Σ l_i²

  qp_sample_points: 360           # QP 降采样点数                             

  # ---- SQP 外层迭代 ----
  max_sqp_iter: 3                 # 序列二次规划迭代次数
                                  
  # ---- ADMM 内层求解 ----
  admm_max_iter: 100              # ADMM 最大迭代次数（实际以收敛判据为准，很少跑满）
  admm_rho: 10.0                  # ADMM 惩罚参数，控制约束违反的惩罚力度
                                  # 越大收敛越稳定但越慢，1~100
  admm_eps_abs: 0.0001            # 绝对收敛容差（原始残差）
  admm_eps_rel: 0.0001            # 相对收敛容差（对偶残差）

  # ---- 数值 ----
  regularization: 0.000001        # 数值正则化 ε，保证 P 矩阵正定可分解

  # ---- 调试 ----
  verbose: false                  # 输出每步残差，调试开，正式关
